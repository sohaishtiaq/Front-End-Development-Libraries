<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photography Exhibit</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
     <div class="main-container grid grid-cols-3 gap-6">
       <div class="card rounded-lg p-4">
         <img
           src="https://placehold.co/400x250"
           alt="Mountain landscape"
           class="rounded-lg"
         />
         <h2 class="subheading font-bold text-xl">Mountain Escape</h2>
         <p class="description text-sm">
            Enjoy the beauty of mountains and peaceful natural surroundings.
         </p>
      </div>

      <div class="card rounded-lg p-4">
        <img
          src="https://placehold.co/400x250"
          alt="Beautiful beach"
          class="rounded-lg"
        />
        <h2 class="subheading font-bold text-xl">Beach Paradise</h2>
        <p class="description text-sm">
          Relax beside clear blue water and enjoy the warmth of the sun.
        </p>
      </div>

      <div class="card rounded-lg p-4">
        <img
          src="https://placehold.co/400x250"
          alt="Green forest"
          class="rounded-lg"
        />
        <h2 class="subheading font-bold text-xl">Forest Adventure</h2>
        <p class="description text-sm">
          Explore green forests and discover the wonders of nature.
        </p>
      </div>
    </div>
  </body>
</html>

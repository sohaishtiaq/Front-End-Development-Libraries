<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Shopping Cart Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    
    <div id="shopping-cart-container" class="flex flex-col lg:flex-row gap-6 p-6">

      <div id="products-container" class="flex-1 space-y-4">

        <div class="card border rounded-lg p-4">
          <h2 class="text-xl font-bold">Wireless Headphones</h2>
          <p class="quantity">Quantity: 2</p>
          <p class="price">Price: $50</p>
          <button class="remove-button bg-red-500 hover:bg-red-700 text-white px-4 py-2 rounded">
          Remove
          </button>
        </div>

        <div class="card border rounded-lg p-4">
          <h2 class="text-xl font-bold">Wireless Mouse</h2>
          <p class="quantity">Quantity: 1</p>
          <p class="price">Price: $25</p>
          <button class="remove-button bg-red-500 hover:bg-red-700 text-white px-4 py-2 rounded">
           Remove
          </button>
        </div>
      </div>
      <div id="order-summary-container" class="rounded-lg border p-6">
        <h2 class="text-2xl font-bold mb-4">Order Summary</h2>

        <p id="total" class="font-bold text-lg">Total:</p>
        <p id="total-amount" class="text-lg">$125</p>

        <a href="#" class="block text-center bg-blue-500 hover:bg-blue-700 text-white px-4 py-2 rounded mt-4">
      Checkout
        </a>
      </div>
    </div>
  </body>
</html>
